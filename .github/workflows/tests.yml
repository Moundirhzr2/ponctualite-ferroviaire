name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # No network, no database file, no Supabase: every test builds the few
      # rows it needs in an in-memory SQLite database.
      - name: Test
        run: pytest -v
